name: Tester report
description: Tried Jarvis? Tell us what worked, what broke, or what was confusing.
title: "[Tester] "
labels: ["tester-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Jarvis! One report per problem is easiest to follow.
        **Before pasting logs, remove your IP addresses, usernames, keys and anything else personal.**
        Found a security problem? Please don't post it here — use **Security → Report a vulnerability** instead.

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Server setup (Oracle / Linux, models, systemd)
        - Private network (WireGuard)
        - Laptop (ctl, tunnel, SSH)
        - Phone setup (Termux, j client)
        - Voice (recording, Whisper, spoken replies)
        - Home-screen buttons (Termux:Widget)
        - Reminders / alarms / morning brief
        - Health alerts
        - README / documentation
        - Other
    validations:
      required: true

  - type: input
    id: setup
    attributes:
      label: Your setup
      description: Server OS/size, laptop distro + desktop, phone model + Android/ROM version
      placeholder: "Oracle A1 2 OCPU/12 GB, Oracle Linux 9 · Fedora 45 GNOME · Pixel 6, GrapheneOS"
    validations:
      required: true

  - type: input
    id: step
    attributes:
      label: Which step or command?
      placeholder: "bash ~/add-widgets.sh  /  README step 2  /  j remind \"in 5 minutes to test\""
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output or logs (optional)
      description: Paste the relevant output. It's shown as code automatically.
      render: shell

  - type: dropdown
    id: outcome
    attributes:
      label: Did you get past it?
      options:
        - "No, I'm stuck"
        - Yes, with a workaround (please describe above)
        - It works — this is just feedback
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed IP addresses, usernames, keys and other personal details from what I pasted.
          required: true
